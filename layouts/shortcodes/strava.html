<!-- layouts/shortcodes/strava_embed.html -->
{{ $id := .Get "id" }}

<div
  class="strava-embed-wrapper">
  <div
    class="strava-embed-placeholder"
    data-embed-type="activity"
    data-embed-id="{{ $id }}"
    data-style="standard">
  </div>
</div>

<script async src="https://strava-embeds.com/embed.js"></script>

<style>
.strava-embed-wrapper iframe {
  width: 100% !important;
  max-width: 100% !important;
}

.strava-embed-wrapper {
  max-width: 800px;
  margin: 0 auto;
}

</style>
